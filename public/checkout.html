<!DOCTYPE html>
<html>
<head>
    <title>Buildify Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #FFFFFF;
        color: #0F0F0F;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        text-align: center;
      }
      .card { padding: 32px; }
      .brand { color: #19A463; font-weight: 800; font-size: 22px; }
      .msg { color: #6B7280; margin-top: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
      <div class="brand">Buildify</div>
      <p class="msg" id="status">Opening secure checkout&hellip;</p>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var sessionId = params.get("session_id");
        var mode = params.get("mode") === "sandbox" ? "sandbox" : "production";
        var statusEl = document.getElementById("status");

        if (!sessionId) {
          statusEl.textContent = "Missing payment session. Please try again from the app.";
          return;
        }

        try {
          var cashfree = Cashfree({ mode: mode });
          cashfree.checkout({
            paymentSessionId: sessionId,
            redirectTarget: "_self",
          });
        } catch (e) {
          statusEl.textContent = "Unable to start checkout: " + e.message;
        }
      })();
    </script>
</body>
</html>
