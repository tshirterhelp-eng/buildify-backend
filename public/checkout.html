<!DOCTYPE html>
<html>
<head>
    <title>Buildify Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #FFFFFF;
        color: #0F0F0F;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        text-align: center;
      }
      .card { padding: 32px; }
      .brand { color: #19A463; font-weight: 800; font-size: 22px; }
      .msg { color: #6B7280; margin-top: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
      <div class="brand">Buildify</div>
      <p class="msg" id="status">Opening secure checkout&hellip;</p>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var orderId = params.get("order_id");
        var amount = params.get("amount");
        var key = params.get("key");
        var statusEl = document.getElementById("status");

        function returnToApp() {
          window.location = "buildify://payment-success?order_id=" + orderId;
        }

        if (!orderId || !key) {
          statusEl.textContent = "Missing payment details. Please try again from the app.";
          return;
        }

        var options = {
          key: key,
          order_id: orderId,
          amount: amount,
          currency: "INR",
          name: "Buildify",
          description: "Unlock customer contact",
          theme: { color: "#1DBF73" },
          handler: function (response) {
            statusEl.textContent = "Confirming payment&hellip;";
            fetch("/api/payments/verify", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(response),
            })
              .then(function () { returnToApp(); })
              .catch(function () { returnToApp(); });
          },
          modal: {
            ondismiss: function () {
              statusEl.textContent = "Payment cancelled. You can close this page.";
            },
          },
        };

        try {
          var rzp = new Razorpay(options);
          rzp.open();
        } catch (e) {
          statusEl.textContent = "Unable to start checkout: " + e.message;
        }
      })();
    </script>
</body>
</html>
